<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Explorer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <script src="pokemon.js" defer></script>
  </head>
  <body>
    <div class="container">
        <h1>Pokemon Explorer</h1>
      <div class="controls">
        <input id="searchInput" type="text" placeholder="Search by name or ID..." />
        <button id="searchBtn" type="button">Search</button>
        <button id="first12Btn" type="button">Show First 12</button>
        <button id="showMorePokemonBtn" type="button">Show More</button>
      </div>
      <div id="characterCards"></div>
    </div>
  </body>
</html>
